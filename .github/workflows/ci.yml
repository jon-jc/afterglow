name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: afterglow
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: afterglow
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U afterglow'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: PostgreSQL concurrency and reconciliation
        run: go test -race -count=1 ./internal/core
        env:
          TEST_DATABASE_URL: postgres://afterglow:local-test-only@localhost:5432/afterglow?sslmode=disable
      - run: go build ./cmd/afterglow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/smoke.mjs
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate
